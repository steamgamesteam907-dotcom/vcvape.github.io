<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hamster Tap</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
      text-align: center;
      user-select: none;
    }

    #app {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 30px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .screen {
      display: none;
      width: 100%;
    }
    .screen.active {
      display: block;
    }

    .coin {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 10px 0 20px;
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .coin span {
      font-size: 2.8rem;
      background: none;
      -webkit-text-fill-color: #fff;
    }

    .tapper {
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: url('bot.jpg') center/cover no-repeat;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.2), 0 0 20px rgba(255,215,0,0.5);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      position: relative;
    }
    .tapper:active {
      transform: scale(0.9);
      box-shadow: 0 0 0 6px rgba(255,215,0,0.8), 0 0 30px gold;
    }

    .shop-item {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(5px);
      margin: 12px 0;
      padding: 15px 20px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
      transition: background 0.2s;
    }
    .shop-item:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    button {
      background: linear-gradient(135deg, #e94560, #c23152);
      border: none;
      color: white;
      padding: 12px 25px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }
    button:active {
      transform: scale(0.95);
      box-shadow: 0 2px 10px rgba(233, 69, 96, 0.6);
    }
    button:disabled {
      background: #555;
      box-shadow: none;
      color: #aaa;
      cursor: not-allowed;
      transform: none;
    }

    #orderBtn {
      margin-top: 20px;
      width: 100%;
    }

    nav {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      justify-content: center;
    }
    nav button {
      background: rgba(255,255,255,0.1);
      box-shadow: none;
      font-size: 1.1rem;
      padding: 12px 20px;
    }
    nav button:hover {
      background: rgba(255,255,255,0.2);
    }

    #orderMessage {
      margin-top: 10px;
      color: #f6d365;
      font-weight: 500;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #f6d365, #fda085);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Экран кликера -->
    <div id="clicker" class="screen active">
      <div class="coin">💰 <span id="balance">0</span></div>
      <div class="tapper" id="tapperBtn"></div>
      <p>Тапай на фото!</p>
    </div>

    <!-- Экран магазина -->
    <div id="shop" class="screen">
      <h2>Магазин</h2>
      <div id="shopItems"></div>
      <button id="orderBtn" disabled>Заказать товар</button>
      <p id="orderMessage"></p>
    </div>

    <!-- Навигация -->
    <nav>
      <button onclick="showScreen('clicker')">🐹 Тапалка</button>
      <button onclick="showScreen('shop')">🛒 Магазин</button>
    </nav>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let coins = parseInt(localStorage.getItem('coins') || '0');
    let inventory = JSON.parse(localStorage.getItem('inventory') || '[]');
    const shopItems = [
      { id: 1, name: '🔥 Буст х2', cost: 100, description: 'Удвой монеты (на сервере)' },
      { id: 2, name: '🎁 Мерч Хомяк', cost: 500, description: 'Футболка с хомяком' }
    ];

    function updateUI() {
      document.getElementById('balance').textContent = coins;
      renderShop();
      saveState();
    }

    function saveState() {
      localStorage.setItem('coins', coins);
      localStorage.setItem('inventory', JSON.stringify(inventory));
    }

    document.getElementById('tapperBtn').addEventListener('click', () => {
      coins += 1;
      updateUI();
    });

    function renderShop() {
      const container = document.getElementById('shopItems');
      container.innerHTML = shopItems.map(item => {
        const owned = inventory.includes(item.id);
        return `
          <div class="shop-item">
            <span>${item.name} – ${item.cost} 💰</span>
            <button onclick="buyItem(${item.id})" ${coins < item.cost || owned ? 'disabled' : ''}>
              ${owned ? 'Куплено' : 'Купить'}
            </button>
          </div>`;
      }).join('');

      const selectedItem = shopItems.find(i => inventory.includes(i.id));
      const orderBtn = document.getElementById('orderBtn');
      if (selectedItem) {
        orderBtn.disabled = false;
        orderBtn.textContent = `Заказать: ${selectedItem.name}`;
      } else {
        orderBtn.disabled = true;
        orderBtn.textContent = 'Купите товар для заказа';
      }
    }

    function buyItem(id) {
      const item = shopItems.find(i => i.id === id);
      if (!item || coins < item.cost || inventory.includes(id)) return;
      coins -= item.cost;
      inventory.push(id);
      updateUI();
    }

    document.getElementById('orderBtn').addEventListener('click', () => {
      const item = shopItems.find(i => inventory.includes(i.id));
      if (!item) return;

      tg.sendData(JSON.stringify({
        initData: tg.initData,
        data: {
          action: 'order',
          item_id: item.id,
          item_name: item.name,
          coins_spent: item.cost
        }
      }));

      document.getElementById('orderMessage').textContent = 'Заказ отправлен!';
    });

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    updateUI();
  </script>
</body>
</html>
